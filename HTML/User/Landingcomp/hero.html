<!-- SkyFlow Hero Component -->
<section class="hero-section">
  <div class="hero-content">
    <p class="hero-eyebrow">Fly Beyond Boundaries</p>
    <h1 class="hero-title">WHERE <span class="hero-title-accent">JOURNEYS</span> TAKE FLIGHT</h1>
    <p class="hero-copy">
      Discover seamless travel experiences, curated for comfort, speed, and style.
    </p>
    <div class="hero-actions">
      <a href="#" class="hero-button">Book Your Flight</a>
    </div>

    <div class="hero-search-card">
      <div class="hero-search-tabs">
        <span class="hero-search-tab is-active">Flights</span>
        <span class="hero-search-tab">Hotels</span>
        <span class="hero-search-tab">Cars</span>
        <span class="hero-search-tab">Packages</span>
      </div>

      <div class="hero-search-fields">
        <div class="hero-search-field">
          <span class="hero-search-label">From</span>
          <div class="hero-search-value">DXB</div>
          <div class="hero-search-subvalue">Dubai, UAE</div>
        </div>

        <div class="hero-search-field">
          <span class="hero-search-label">To</span>
          <div class="hero-search-value">LHR</div>
          <div class="hero-search-subvalue">London, UK</div>
        </div>

        <div class="hero-search-field">
          <span class="hero-search-label">Depart</span>
          <div class="hero-search-value">12 Jun, 2025</div>
          <div class="hero-search-subvalue">Thu, 12 Jun</div>
        </div>

        <div class="hero-search-field">
          <span class="hero-search-label">Passengers</span>
          <div class="hero-search-value">1 Passenger</div>
          <div class="hero-search-subvalue">Economy</div>
        </div>

        <div class="hero-search-field">
          <button class="hero-search-button" type="button">Search Flights</button>
        </div>
      </div>
    </div>
  </div>
</section>
