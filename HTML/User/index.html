<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFlow – Airline Management System</title>

  <!-- Global reset + tokens -->
  <style>
    :root {
      --bg-dark: #001d39;
      --white:   #ffffff;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: #bdd8e9;
      overflow-x: hidden;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>

  <!-- Component stylesheets -->
  <link rel="stylesheet" href="../../CSS/globalcomp/navbar.css">
  <link rel="stylesheet" href="../../CSS/Landingcomp/hero.css">
  <link rel="stylesheet" href="../../CSS/Landingcomp/flights.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/footer.css">
</head>
<body>

  <!-- Component placeholders — filled by loadComponent() below -->
  <div id="navbar-root"></div>
  <main>
    <div id="hero-root"></div>
    <div id="flights-root"></div>
  </main>
  <div id="footer-root"></div>

  <script>
    // Load an HTML file and inject it into the target element
    async function loadComponent(file, targetId) {
      const res  = await fetch(file, { cache: 'no-store' });
      const html = await res.text();
      document.getElementById(targetId).innerHTML = html;
    }

    // Load all components, then start the app
    async function init() {
      await loadComponent('globalcomp/navbar.html',  'navbar-root');
      await loadComponent('Landingcomp/hero.html',    'hero-root');
      await loadComponent('Landingcomp/flights.html', 'flights-root');
      await loadComponent('globalcomp/footer.html',  'footer-root');

      // Now that the DOM is ready, run the flights script
      const script = document.createElement('script');
      script.src = '../../Javascript/User/flights.js';
      document.body.appendChild(script);
    }

    init();
  </script>

</body>
</html>
