<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFlow - Airline Management System</title>

  <!-- Global Stylesheets -->
  <link rel="stylesheet" href="../../CSS/User/style.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/navbar.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/footer.css">
  <link rel="stylesheet" href="../../CSS/User/signup.css">
</head>
<body>
  <!-- Dynamic Component Containers -->
  <div id="navbar-container"></div>
  <main id="app-content"></main>
  <div id="footer-container"></div>

  <!-- Embedded Authentication Drawer Component -->
  <div id="auth-drawer-container">
    <div id="auth-drawer" class="auth-drawer" aria-hidden="true">
      <div class="auth-overlay" onclick="closeAuthDrawer()"></div>
      <div class="auth-panel">
        <div class="auth-top-sticky">
          <div class="auth-header">
            <div class="auth-brand">
              <svg class="auth-logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 15.5L11.5 3l-1.8 8.2L21 9.5 8.5 21l2.3-8.5L3 15.5Z" fill="currentColor"/>
              </svg>
              <span>SkyFlow</span>
            </div>
            <button type="button" class="auth-close-btn" onclick="closeAuthDrawer()">&times;</button>
          </div>
          <div class="auth-tabs">
            <button type="button" id="tab-signin" class="auth-tab active" onclick="switchAuthTab('signin')">Sign In</button>
            <button type="button" id="tab-signup" class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
          </div>
        </div>

        <div class="auth-body">
          <!-- Sign In Section -->
          <div id="section-signin" class="auth-section active">
            <div class="auth-intro">
              <h3>Welcome Back</h3>
              <p>Sign in to access your flight bookings and preferences.</p>
            </div>
            <form id="form-signin" class="auth-form" onsubmit="handleFormSubmit(event, 'signin')">
              <div class="form-group">
                <label for="signin-email">Email Address</label>
                <input type="email" id="signin-email" placeholder="name@example.com" required autocomplete="email">
              </div>
              <div class="form-group">
                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" placeholder="••••••••" required autocomplete="current-password">
              </div>
              <div class="form-options">
                <label class="remember-me"><input type="checkbox"> <span>Remember me</span></label>
                <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('Password reset link sent to your email.');">Forgot password?</a>
              </div>
              <button type="submit" class="auth-submit-btn">Sign In to SkyFlow</button>
            </form>
            <div class="auth-divider"><span>or sign in with</span></div>
            <div class="social-auth-grid">
              <button type="button" class="social-btn" onclick="handleSocialAuth('google')">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
                <span class="social-btn-label">Google</span>
              </button>
              <button type="button" class="social-btn" onclick="handleSocialAuth('apple')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#000000"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 .6-2.64 1.35-.58.67-1.09 1.75-.95 2.78 1.01.08 2.04-.53 2.66-1.28"/></svg>
                <span class="social-btn-label">Apple</span>
              </button>
              <button type="button" class="social-btn" onclick="handleSocialAuth('facebook')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <span class="social-btn-label">Facebook</span>
              </button>
            </div>
            <div class="auth-footer-text">
              Don't have an account? <a href="#" onclick="event.preventDefault(); switchAuthTab('signup');">Create account</a>
            </div>
          </div>

          <!-- Sign Up Section -->
          <div id="section-signup" class="auth-section">
            <div class="auth-intro">
              <h3>Create Your Account</h3>
              <p>Join SkyFlow today for exclusive flight offers and seamless travel.</p>
            </div>
            <form id="form-signup" class="auth-form" onsubmit="handleFormSubmit(event, 'signup')">
              <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="John Doe" required autocomplete="name">
              </div>
              <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" placeholder="name@example.com" required autocomplete="email">
              </div>
              <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password">
              </div>
              <div class="form-group">
                <label for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" placeholder="Re-enter password" minlength="8" required autocomplete="new-password">
              </div>
              <button type="submit" class="auth-submit-btn">Create SkyFlow Account</button>
            </form>
            <div class="auth-divider"><span>or sign up with</span></div>
            <div class="social-auth-grid">
              <button type="button" class="social-btn" onclick="handleSocialAuth('google')">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
                <span class="social-btn-label">Google</span>
              </button>
              <button type="button" class="social-btn" onclick="handleSocialAuth('apple')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#000000"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 .6-2.64 1.35-.58.67-1.09 1.75-.95 2.78 1.01.08 2.04-.53 2.66-1.28"/></svg>
                <span class="social-btn-label">Apple</span>
              </button>
              <button type="button" class="social-btn" onclick="handleSocialAuth('facebook')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <span class="social-btn-label">Facebook</span>
              </button>
            </div>
            <div class="auth-footer-text">
              Already have an account? <a href="#" onclick="event.preventDefault(); switchAuthTab('signin');">Sign in instead</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Authentication Logic -->
  <script src="../../Javascript/User/auth.js"></script>

  <!-- Component Loader Script (with local file fallback) -->
  <script>
    async function loadComponent(url, containerId) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to load ${url}`);
        const html = await response.text();
        document.getElementById(containerId).innerHTML = html;
      } catch (error) {
        console.warn('Component fetch failed (likely opening directly via file:// protocol). Container fallback active for:', containerId);
      }
    }

    async function initApp() {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      // Load global components via fetch if server available
      await loadComponent('globalcomp/navbar.html', 'navbar-container');
      await loadComponent('globalcomp/footer.html', 'footer-container');
      if (typeof updateNavbarAuthState === 'function') {
        updateNavbarAuthState();
      }

      // Setup routing for main content
      async function handleRoute() {
        const hash = window.location.hash ? window.location.hash.substring(1) : 'hero';
        
        // Define route mappings
        const routes = {
          'hero': 'Landingcomp/hero.html',
          'book': 'Landingcomp/hero.html',
          'manage': 'Landingcomp/hero.html',
          'flights': 'Landingcomp/hero.html',
          'track-flight': 'Landingcomp/hero.html',
          'offers': 'Landingcomp/hero.html',
          'help': 'Landingcomp/hero.html'
        };

        const pageUrl = routes[hash] || routes.hero;
        await loadComponent(pageUrl, 'app-content');
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      }

      // Initial route load
      await handleRoute();

      // Listen for hash changes
      window.addEventListener('hashchange', handleRoute);
    }

    // Initialize when DOM is ready
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
