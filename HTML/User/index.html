<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFlow – Airline Management System</title>

  <!-- Global & Component Stylesheets -->
  <link rel="stylesheet" href="../../CSS/User/style.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/navbar.css">
  <link rel="stylesheet" href="../../CSS/Landingcomp/hero.css">
  <link rel="stylesheet" href="../../CSS/Landingcomp/flights.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/footer.css">
  <link rel="stylesheet" href="../../CSS/User/signup.css">
</head>

<body>
  <!-- Dynamic Component Containers -->
  <div id="navbar-container"></div>
  <main id="app-content"></main>
  <div id="footer-container"></div>

  <!-- Component Loader Script -->
  <script>
    async function loadComponent(url, containerId) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to load ${url}`);
        const html = await response.text();
        document.getElementById(containerId).innerHTML = html;
      } catch (error) {
        console.error('Error loading component:', error);
      }
    }

    async function initApp() {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      // Load global components
      await loadComponent('globalcomp/navbar.html', 'navbar-container');
      await loadComponent('globalcomp/footer.html', 'footer-container');

      // Setup routing for main content
      async function handleRoute() {
        const hash = window.location.hash ? window.location.hash.substring(1) : 'hero';

        // Define route mappings
        const routes = {
          'hero': 'Landingcomp/hero.html',
          'book': 'Landingcomp/hero.html',
          'manage': 'Landingcomp/hero.html',
          'flights': 'Landingcomp/hero.html',
          'track-flight': 'Landingcomp/hero.html',
          'offers': 'Landingcomp/hero.html',
          'help': 'Landingcomp/hero.html'
        };

        const pageUrl = routes[hash] || routes.hero;
        await loadComponent(pageUrl, 'app-content');
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      }

      // Initial route load
      await handleRoute();

      // Listen for hash changes
      window.addEventListener('hashchange', handleRoute);
    }

    // Initialize when DOM is ready
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>

</html>
