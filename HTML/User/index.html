<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFlow - Airline Management System</title>

  <!-- Global Stylesheets -->
  <link rel="stylesheet" href="../../CSS/User/style.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/navbar.css">
</head>
<body>

  <!-- SkyFlow Navbar Component (Pure HTML & CSS) -->
  <header>
    <nav class="navbar">
      <!-- Brand Logo -->
      <a href="#" class="navbar-logo">Sky<span>Flow</span></a>

      <!-- Pure CSS Mobile Toggle Checkbox -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">

      <!-- Mobile Menu Button Label -->
      <label for="nav-toggle" class="mobile-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <!-- Navigation Links -->
      <ul class="nav-menu" id="navMenu">
        <li><a href="#" class="nav-link active">Home</a></li>
        <li><a href="#" class="nav-link">Flights</a></li>
        <li><a href="#" class="nav-link">Bookings</a></li>
        <li><a href="#" class="nav-link">Flight Status</a></li>
        <li><a href="#" class="nav-link">Dashboard</a></li>
        <li><a href="#" class="nav-link">Contact</a></li>
      </ul>

      <!-- Action Buttons -->
      <div class="nav-actions" id="navActions">
        <a href="#" class="btn-signin">Sign In</a>
        <a href="#" class="btn-get-started">Get Started</a>
      </div>
    </nav>
  </header>

  <!-- SkyFlow Hero Component Section -->
  <main>
    <section class="hero-section" style="padding: 5rem 2rem; max-width: 1200px; margin: 0 auto; text-align: center;">
      <h1 style="font-size: 3rem; color: var(--color-white); margin-bottom: 1.2rem;">
        Fly Smarter with <span style="color: var(--color-sky-blue);">SkyFlow</span>
      </h1>
      <p style="color: var(--color-ice-blue); font-size: 1.15rem; max-width: 600px; margin: 0 auto 2rem auto; line-height: 1.6;">
        Seamless flight bookings, real-time status tracking, and effortless airline management.
      </p>
      <a href="#" class="btn-get-started" style="display: inline-block;">Explore Flights</a>
    </section>
  </main>
</body>
</html>
